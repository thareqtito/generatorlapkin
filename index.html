<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Capaian Kinerja</title>
<meta name="description" content="Generator Laporan Monitoring dan Evaluasi Capaian Kinerja — Subbagian Rendatin KPU Kabupaten Pacitan">
<style>
:root{
  --bg:#f5f3f1;--surface:#fff;--surface-2:#faf8f6;--border:#e8e2dd;--text:#29211f;--muted:#7b706b;
  --primary:#8c1c22;--primary-dark:#6a1218;--primary-soft:#f7e7e8;
  --danger:#c62828;--danger-soft:#fdecea;--warn:#a15c00;--warn-soft:#fff3dc;--ok:#2e7d32;--ok-soft:#e7f4e8;--info:#1f5f8b;--info-soft:#e5eff7;
  --radius:12px;--shadow:0 1px 2px rgba(40,20,15,.04),0 6px 18px rgba(40,20,15,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.hidden{display:none!important}
a{color:var(--primary)}

/* top */
.topbar{background:var(--primary);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex-shrink:0}
.brand b{display:block;font-size:15.5px;font-weight:800}
.brand small{display:block;opacity:.82;font-size:11.5px}
.spacer{flex:1}
.proj-chip{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.save-state{font-size:12px;opacity:.9;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.24)}
.tbtn.solid{background:#fff;color:var(--primary)}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 14px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:700}
nav.tabs button.active{color:#fff;border-bottom-color:#fff}
nav.tabs .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);font-size:11px;margin-right:6px}

main{max-width:1280px;margin:0 auto;padding:18px 16px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:21px;font-weight:800}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:760px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:800}
.card-b{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field small{font-size:11.5px;color:var(--muted)}
input,select,textarea{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--primary-soft);border-color:var(--primary)}
input[type=checkbox]{width:auto}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger);border-color:#f2c5c1}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.xs{padding:2px 7px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.big{padding:12px 18px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{background:var(--info-soft);color:#173f5c;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:#6b3d00}
.note.ok{background:var(--ok-soft);color:#1e5a22}
.note code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:5px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-err{background:var(--danger-soft);color:var(--danger)}.b-info{background:var(--info-soft);color:var(--info)}
.b-plain{background:#f0edea;color:#5a504b}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t input{padding:5px 7px;border-radius:7px}
table.t tfoot td{font-weight:800;background:var(--surface-2)}
.terbilang{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:6px}

/* list editor */
.le-item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.le-item .no{font-weight:800;color:var(--muted);padding-top:8px;text-align:right}

/* narasi */
.nar-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:980px){.nar-wrap{grid-template-columns:1fr}}
.seg{display:inline-flex;background:#ece7e3;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sas-list{max-height:calc(100vh - 220px);overflow-y:auto;position:sticky;top:112px}
.sas-item{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit}
.sas-item:hover{background:var(--surface-2)}
.sas-item.active{background:var(--primary-soft)}
.sas-item .nn{font-weight:800;color:var(--primary)}
.sas-item .tt{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:4px;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d8d1cc}
.dot.custom{background:var(--ok)}.dot.lalu{background:#e0a100}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ind-tbl{margin-top:10px}
.sec{border:1px solid var(--border);border-radius:12px;margin-bottom:14px;background:#fff}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface-2);border-radius:12px 12px 0 0}
.sec-h h4{font-size:14px;font-weight:800}
.sec-b{padding:12px 14px}
.ringkas{background:#fbf9f7;border:1px dashed var(--border);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;white-space:pre-wrap}
.ringkas b{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.blk{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff;position:relative}
.blk-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.blk-h .lbl{font-size:11.5px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.04em;flex:1}
.add-bar{display:flex;gap:6px;flex-wrap:wrap}
.add-bar .btn{border-style:dashed}
.tbl-ed{overflow-x:auto}
.tbl-ed table{border-collapse:collapse}
.tbl-ed td{padding:2px}
.tbl-ed input{min-width:120px;padding:5px 7px;font-size:13px}
.tbl-ed tr:first-child input{font-weight:700;background:#faf6f3}
.preview-letter{font-weight:800;color:var(--muted);margin-right:4px}

/* periksa */
.iss{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 16px;border-bottom:1px solid var(--border)}
.iss:last-child{border-bottom:0}
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.gen-grid{grid-template-columns:1fr}}
.cover-prev{width:84px;height:118px;border-radius:6px;border:1px solid var(--border);object-fit:cover;background:#f0edea}

/* modal, toast */
#modal{position:fixed;inset:0;background:rgba(30,15,12,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow-y:auto}
.mcard{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border)}
.mhead h3{font-size:16px;font-weight:800}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.xbtn{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:460px}
.toast{background:#2a2321;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.toast.err{background:var(--danger)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:70;display:grid;place-items:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--primary-soft);border-top-color:var(--primary);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-msg{margin-top:10px;font-weight:700;color:var(--primary);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:8px 0 24px}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-in">
    <div class="brand">
      <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></div>
      <div><b>Generator Capaian Kinerja</b><small>Laporan Monev Ketua & Sekretaris · Rendatin KPU Kab. Pacitan</small></div>
    </div>
    <div class="spacer"></div>
    <span class="proj-chip" id="projChip">Belum ada proyek</span>
    <span class="save-state" id="saveState"></span>
    <button class="tbtn" id="btnOpen" title="Buka file proyek (.json) dari OneDrive">Buka</button>
    <button class="tbtn solid" id="btnSave" title="Simpan file proyek (Ctrl+S)">Simpan</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="proyek"><span class="n">1</span>Proyek</button>
    <button data-view="data"><span class="n">2</span>Data Capaian</button>
    <button data-view="anggaran"><span class="n">3</span>Anggaran</button>
    <button data-view="rapat"><span class="n">4</span>Rapat & Penutup</button>
    <button data-view="narasi"><span class="n">5</span>Narasi</button>
    <button data-view="unduh"><span class="n">6</span>Periksa & Unduh</button>
  </nav>
</header>
<main id="main"></main>
<div class="foot">Generator Laporan Capaian Kinerja · Subbagian Perencanaan, Data dan Informasi KPU Kabupaten Pacitan</div>

<input type="file" id="fileProyek" accept=".json,application/json" class="hidden">
<div id="modal" class="hidden"><div class="mcard"><div class="mhead"><h3 id="mTitle"></h3><button class="xbtn" id="mClose">×</button></div><div class="mbody" id="mBody"></div><div class="mfoot" id="mFoot"></div></div></div>
<div id="toasts"></div>
<div id="loading" class="hidden"><div><div class="spin" style="margin:auto"></div><div class="loading-msg" id="loadingMsg"></div></div></div>

<script src="lib/pizzip.min.js"></script>
<script src="lib/docxtemplater.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="generator-core.js"></script>
<script>
'use strict';
const G = window.GCK;
const R = G.ROMAWI;
const LS_DRAF = 'gck_draf_v1', LS_SET = 'gck_setelan_v1';
const BAGIAN = [['kegiatan', 'Kegiatan yang telah dilaksanakan'], ['kendala', 'Identifikasi hambatan / permasalahan dan kendala'], ['upaya', 'Upaya peningkatan kinerja']];

let P = null;               // proyek aktif
let fileHandle = null;      // handle file (Chrome/Edge)
let dirty = false;          // ada perubahan yang belum disimpan ke file
let view = 'proyek';
const UI = { narJenis: 'KPU', narNo: null, sheetNames: [], sheetSumber: '', xlsxWb: null, tplOverride: { KPU: null, SEK: null }, issues: null };

/* ---------- utilitas ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg, err) { const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), err ? 6000 : 3200); }
function loading(on, msg) { $('#loading').classList.toggle('hidden', !on); $('#loadingMsg').textContent = msg || ''; }
function setelan() { try { return JSON.parse(store.get(LS_SET) || '{}'); } catch (e) { return {}; } }
function simpanSetelan(o) { store.set(LS_SET, JSON.stringify(Object.assign(setelan(), o))); }
function namaFile() { return 'capaian-kinerja-' + P.tahun + '-TW' + P.tw + '.json'; }
function ubah() {
  dirty = true;
  if (P) store.set(LS_DRAF, JSON.stringify(P));
  updTop();
}
function updTop() {
  $('#projChip').textContent = P ? 'Triwulan ' + R[P.tw - 1] + ' · ' + P.tahun : 'Belum ada proyek';
  $('#saveState').textContent = !P ? '' : dirty ? '● Belum disimpan ke file' : '✓ Tersimpan';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}
function openModal(title, body, foot, onMount) {
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body; $('#mFoot').innerHTML = foot || '';
  $('#modal').classList.remove('hidden'); if (onMount) onMount();
}
function closeModal() { $('#modal').classList.add('hidden'); }
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- proyek: buka / simpan ---------- */
function pakaiProyek(p, handle) {
  if (!p || p.app !== 'generator-capaian-kinerja-rendatin') throw new Error('File ini bukan file proyek Generator Capaian Kinerja.');
  const base = G.proyekBaru(p.tahun, p.tw);
  P = Object.assign(base, p);
  ['umum', 'anggaran', 'rapat', 'penutup', 'sheet', 'narasi', 'sampul'].forEach(k => { P[k] = Object.assign({}, base[k], p[k] || {}); });
  P.narasi.KPU = P.narasi.KPU || {}; P.narasi.SEK = P.narasi.SEK || {};
  fileHandle = handle || null; dirty = false; UI.issues = null; UI.narNo = null;
  store.set(LS_DRAF, JSON.stringify(P));
  updTop(); render();
}
async function bukaFile() {
  if (dirty && !confirm('Ada perubahan yang belum disimpan ke file. Tetap buka file lain?')) return;
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Proyek Capaian Kinerja', accept: { 'application/json': ['.json'] } }] });
      const f = await h.getFile();
      pakaiProyek(JSON.parse(await f.text()), h);
      toast('Proyek dibuka: ' + f.name);
    } catch (e) { if (e.name !== 'AbortError') toast(e.message, true); }
    return;
  }
  $('#fileProyek').value = ''; $('#fileProyek').click();
}
$('#fileProyek').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { pakaiProyek(JSON.parse(await f.text())); toast('Proyek dibuka: ' + f.name); } catch (err) { toast(err.message, true); }
});
async function simpanFile(sebagai) {
  if (!P) return toast('Belum ada proyek.', true);
  const text = JSON.stringify(P, null, 1);
  if (window.showSaveFilePicker) {
    try {
      if (!fileHandle || sebagai) fileHandle = await window.showSaveFilePicker({ suggestedName: namaFile(), types: [{ description: 'Proyek Capaian Kinerja', accept: { 'application/json': ['.json'] } }] });
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
      dirty = false; updTop(); toast('Tersimpan ke ' + fileHandle.name);
    } catch (e) { if (e.name !== 'AbortError') toast('Gagal menyimpan: ' + e.message, true); }
    return;
  }
  unduh(new Blob([text], { type: 'application/json' }), namaFile());
  dirty = false; updTop(); toast('File proyek diunduh. Pindahkan ke folder OneDrive bersama.');
}
function unduh(blob, nama) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$('#btnOpen').onclick = bukaFile;
$('#btnSave').onclick = () => simpanFile(false);
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); simpanFile(false); } if (e.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- navigasi ---------- */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (!P && b.dataset.view !== 'proyek') return toast('Buat atau buka proyek terlebih dahulu.', true);
  view = b.dataset.view; render(); window.scrollTo(0, 0);
});
function go(v, opt) { view = v; if (opt && opt.jenis) UI.narJenis = opt.jenis; if (opt && opt.no) UI.narNo = opt.no; render(); window.scrollTo(0, 0); }
function render() {
  updTop();
  const fn = { proyek: vProyek, data: vData, anggaran: vAnggaran, rapat: vRapat, narasi: vNarasi, unduh: vUnduh }[view];
  const old = $('#main'), n = old.cloneNode(false);
  old.replaceWith(n);
  fn(n);
}

/* ============================================================ 1. PROYEK */
function vProyek(m) {
  const ada = !!P;
  let ringkas = '';
  if (ada) {
    const iss = G.periksa(P);
    const e = iss.filter(x => x.level === 'error').length, w = iss.filter(x => x.level === 'warning').length;
    const cek = (ok, t) => '<li>' + (ok ? '<span class="badge b-ok">selesai</span>' : '<span class="badge b-plain">belum</span>') + ' ' + t + '</li>';
    const narN = j => P.sheet[j] ? P.sheet[j].sasaran.filter(s => Object.values(P.narasi[j][s.no] || {}).some(x => x && !G.blokKosong(x.blocks))).length + '/' + P.sheet[j].sasaran.length : '-';
    ringkas = '<div class="card"><div class="card-h"><h3>Status proyek Triwulan ' + R[P.tw - 1] + ' ' + P.tahun + '</h3>' +
      '<span>' + (e ? '<span class="badge b-err">' + e + ' error</span> ' : '') + (w ? '<span class="badge b-warn">' + w + ' peringatan</span>' : '') + (!e && !w ? '<span class="badge b-ok">siap generate</span>' : '') + '</span></div>' +
      '<div class="card-b"><ul style="margin:0;padding-left:0;list-style:none;display:grid;gap:8px">' +

function pratinjau(j) {
  const sh = P.sheet[j]; if (!sh) return '';
  const rows = [];
  sh.sasaran.forEach(s => s.indikator.forEach((i, k) => rows.push('<tr><td>' + (k ? '' : esc(s.no)) + '</td><td>' + (k ? '' : esc(s.sasaran)) + '</td><td>' + esc(i.indikator) + '</td><td class="num">' + esc(i.target) + '</td><td class="num">' + esc(i.target_tw) + '</td><td class="num">' + esc(i.realisasi) + '</td></tr>')));
  return '<div class="card"><div class="card-h"><h3>Pratinjau — ' + G.JENIS[j].label + '</h3><span class="small muted">' + esc(sh.nama_sheet) + '</span></div><div class="tbl-wrap"><table class="t"><thead><tr><th>No</th><th>Sasaran</th><th>Indikator</th><th class="num">Target</th><th class="num">Target TW</th><th class="num">Realisasi</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div></div>';
}
async function apiSheet(params) {
  const s = setelan();
  if (!s.url) throw new Error('URL Web App belum diisi.');
  const u = s.url + (s.url.includes('?') ? '&' : '?') + new URLSearchParams(Object.assign({ key: s.key || '' }, params)).toString();
  let r;
  try { r = await fetch(u); } catch (e) { throw new Error('Tidak dapat terhubung ke Apps Script. Periksa URL dan koneksi internet.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('Respons tidak valid. Pastikan deployment "Siapa saja" dan URL diakhiri /exec.'); }
  if (!j.ok) throw new Error(j.error || 'Gagal membaca spreadsheet.');
  return j.data;
}
async function hubungkan() {
  simpanSetelan({ url: $('#gsUrl').value.trim(), key: $('#gsKey').value });
  loading(true, 'Menghubungkan ke spreadsheet…');
  try {
    const d = await apiSheet({ action: 'list' });
    UI.sheetNames = d.sheets; UI.sheetSumber = 'Google Sheet: ' + d.judul; UI.xlsxWb = null;
    render(); toast('Terhubung: ' + d.judul);
  } catch (e) { toast(e.message, true); } finally { loading(false); }
}
async function imporXlsx(e) {
  const f = e.target.files[0]; if (!f) return;
  loading(true, 'Membaca file…');
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    UI.xlsxWb = wb; UI.sheetNames = wb.SheetNames.slice(); UI.sheetSumber = 'File: ' + f.name;
    render();
  } catch (err) { toast('Gagal membaca file: ' + err.message, true); } finally { loading(false); }
}
async function ambilGrid(nama) {
  if (UI.xlsxWb) return XLSX.utils.sheet_to_json(UI.xlsxWb.Sheets[nama], { header: 1, raw: false, defval: '' });
  const d = await apiSheet({ action: 'read', sheet: nama });
  return d.values;
}
async function ambilData() {
  const pilih = { KPU: $('#selK').value, SEK: $('#selS').value };
  if (!pilih.KPU && !pilih.SEK) return toast('Pilih minimal satu sheet.', true);
  loading(true, 'Mengambil data…');
  const pesan = [];
  try {
    for (const j of ['KPU', 'SEK']) {
      if (!pilih[j]) continue;
      const grid = await ambilGrid(pilih[j]);
      const sh = G.parseGrid(grid);
      sh.nama_sheet = pilih[j]; sh.diambil = new Date().toISOString(); sh.sumber = UI.xlsxWb ? 'file .xlsx' : 'Google Sheet';
      const lama = P.sheet[j];
      P.sheet[j] = sh;
      pesan.push(G.JENIS[j].pendek + ': ' + sh.sasaran.length + ' sasaran');
      if (lama && lama.sasaran.length !== sh.sasaran.length) toast('Perhatian: jumlah sasaran ' + G.JENIS[j].pendek + ' berubah (' + lama.sasaran.length + ' → ' + sh.sasaran.length + '). Periksa kembali narasi.', true);
      if (sh.tw_header && sh.tw_header !== P.tw) toast('Sheet ' + pilih[j] + ' berisi data Triwulan ' + R[sh.tw_header - 1] + ', bukan Triwulan ' + R[P.tw - 1] + '.', true);
    }
    UI.issues = null; ubah(); render(); toast('Data diambil — ' + pesan.join(', '));
  } catch (e) { toast(e.message, true); } finally { loading(false); }
}

function getItem(j, no, b) { return ((P.narasi[j] || {})[no] || {})[b]; }
function setBlocks(j, no, b, blocks) {
  P.narasi[j] = P.narasi[j] || {};
  P.narasi[j][no] = P.narasi[j][no] || {};
  const old = P.narasi[j][no][b] || {};

}
function secEditor(j, s, b, label) {

  const badge = st === 'custom' ? '<span class="badge b-ok">dikembangkan</span>' : st === 'lalu' ? '<span class="badge b-warn">salinan TW lalu</span>' : '<span class="badge b-plain">memakai ringkasan</span>';
  return '<div class="sec" data-sec="' + b + '"><div class="sec-h"><h4>' + label + ' ' + badge + '</h4><div class="row">' +
    '<button class="btn sm" data-sa="mulai">Mulai dari ringkasan</button>' + (blocks.length ? '<button class="btn sm danger" data-sa="kosong">Kosongkan</button>' : '') + '</div></div>' +

function blokEditor(bl, i, all) {
  const subNo = all.slice(0, i + 1).filter(x => x.t === 'sub').length;
  const ctrl = '<button class="btn xs" data-bm="up" title="Naik">↑</button><button class="btn xs" data-bm="down" title="Turun">↓</button><button class="btn xs danger" data-bm="del" title="Hapus">×</button>';
  let body = '', lbl = '';

  if (bl.t === 'sub') {

    body = '<input data-bf="judul" placeholder="Judul sub-poin" value="' + esc(bl.judul) + '" style="font-weight:700;margin-bottom:6px"><textarea data-bf="isi" rows="3" placeholder="Isi/penjelasan (boleh beberapa paragraf, pisahkan dengan baris baru)">' + esc(bl.isi) + '</textarea>';
  }
  if (bl.t === 'list') {
    lbl = 'Daftar';
    body = '<div class="row" style="margin-bottom:6px"><span class="small muted">Penanda:</span><select data-bf="gaya" style="width:auto">' +
      [['huruf', 'a. b. c.'], ['angka', '1. 2. 3.'], ['angka_kurung', '1) 2) 3)']].map(([v, l]) => '<option value="' + v + '"' + ((bl.gaya || 'huruf') === v ? ' selected' : '') + '>' + l + '</option>').join('') +
      '</select><span class="small muted">satu butir per baris</span></div><textarea data-bf="items" rows="' + Math.max(3, (bl.items || []).length + 1) + '">' + esc((bl.items || []).join('\n')) + '</textarea>';
  }
  if (bl.t === 'tabel') {
    lbl = 'Tabel (baris pertama = judul kolom)';
    const rows = bl.rows && bl.rows.length ? bl.rows : [['', ''], ['', '']];
    const nc = Math.max(...rows.map(r => r.length));
    body = '<div class="tbl-ed"><table>' + rows.map((r, ri) => '<tr>' + Array.from({ length: nc }, (_, ci) => '<td><input data-cell="' + ri + ',' + ci + '" value="' + esc(r[ci] || '') + '"></td>').join('') + '</tr>').join('') + '</table></div>' +
      '<div class="row" style="margin-top:6px"><button class="btn xs" data-tb="addr">+ baris</button><button class="btn xs" data-tb="addc">+ kolom</button><button class="btn xs" data-tb="delr">− baris</button><button class="btn xs" data-tb="delc">− kolom</button>' +
      '<span class="small muted">Tip: salin dari Excel, lalu tempel di sel kiri-atas.</span></div>';
  }
  return '<div class="blk" data-bi="' + i + '"><div class="blk-h"><span class="lbl">' + lbl + '</span>' + ctrl + '</div>' + body + '</div>';

function bindBlok(m, j, s) {
  const blocksOf = b => { const it = getItem(j, s.no, b); return it ? JSON.parse(JSON.stringify(it.blocks || [])) : []; };
  const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  m.querySelectorAll('.sec').forEach(sec => {
    const b = sec.dataset.sec;
    sec.addEventListener('input', e => {
      const t = e.target, blk = t.closest('.blk'); if (!blk) return;
      const i = +blk.dataset.bi; const blocks = blocksOf(b); const bl = blocks[i];
      if (t.dataset.bf === 'items') bl.items = t.value.split('\n');
      else if (t.dataset.bf) bl[t.dataset.bf] = t.value;
      if (t.dataset.cell) {
        const [ri, ci] = t.dataset.cell.split(',').map(Number);
        bl.rows = bl.rows && bl.rows.length ? bl.rows : [['', ''], ['', '']];
        while (bl.rows.length <= ri) bl.rows.push([]);
        bl.rows[ri][ci] = t.value;
      }
      setBlocks(j, s.no, b, blocks); ubah();
    });
    sec.addEventListener('change', e => { if (e.target.dataset.bf === 'items') { const blocks = blocksOf(b); const i = +e.target.closest('.blk').dataset.bi; blocks[i].items = blocks[i].items.map(x => x.trim()).filter(Boolean); setBlocks(j, s.no, b, blocks); ubah(); } });
    sec.addEventListener('paste', e => {
      const t = e.target; if (!t.dataset.cell) return;
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      if (!/[\t\n]/.test(txt.trim())) return;
      e.preventDefault();
      const [r0, c0] = t.dataset.cell.split(',').map(Number);
      const grid = txt.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(l => l.split('\t'));
      const blocks = blocksOf(b); const bl = blocks[+t.closest('.blk').dataset.bi];
      bl.rows = bl.rows && bl.rows.length ? bl.rows : [['']];
      grid.forEach((row, ri) => row.forEach((v, ci) => { while (bl.rows.length <= r0 + ri) bl.rows.push([]); bl.rows[r0 + ri][c0 + ci] = v.trim(); }));
      const nc = Math.max(...bl.rows.map(r => r.length)); bl.rows = bl.rows.map(r => Array.from({ length: nc }, (_, i) => r[i] || ''));
      setBlocks(j, s.no, b, blocks); ubah(); rerender();
    });
    sec.addEventListener('click', e => {
      const t = e.target;
      if (t.dataset.add) {
        const blocks = blocksOf(b);
        const nb = { p: { t: 'p', text: '' }, sub: { t: 'sub', judul: '', isi: '' }, list: { t: 'list', gaya: 'huruf', items: [] }, tabel: { t: 'tabel', rows: [['No', 'Uraian', 'Keterangan'], ['1', '', '']] } }[t.dataset.add];
        blocks.push(nb); setBlocks(j, s.no, b, blocks); ubah(); rerender(); return;
      }
      if (t.dataset.sa === 'mulai') {
        const cur = blocksOf(b);
        if (cur.length && !confirm('Ganti isi bagian ini dengan teks dari ringkasan spreadsheet?')) return;
        setBlocks(j, s.no, b, G.narasiBawaan(j, s, b, P.tw)); ubah(); rerender(); return;
      }
      if (t.dataset.sa === 'kosong') {
        if (!confirm('Kosongkan bagian ini? Laporan akan memakai teks ringkas dari spreadsheet.')) return;
        setBlocks(j, s.no, b, []); ubah(); rerender(); return;
      }
      const blk = t.closest('.blk'); if (!blk) return;
      const i = +blk.dataset.bi; const blocks = blocksOf(b);
      if (t.dataset.bm === 'del') { if (!confirm('Hapus blok ini?')) return; blocks.splice(i, 1); }
      if (t.dataset.bm === 'up' && i > 0) [blocks[i - 1], blocks[i]] = [blocks[i], blocks[i - 1]];
      if (t.dataset.bm === 'down' && i < blocks.length - 1) [blocks[i + 1], blocks[i]] = [blocks[i], blocks[i + 1]];
      if (t.dataset.tb) {
        const bl = blocks[i]; bl.rows = bl.rows && bl.rows.length ? bl.rows : [['', '']];
        const nc = Math.max(...bl.rows.map(r => r.length));
        if (t.dataset.tb === 'addr') bl.rows.push(Array(nc).fill(''));
        if (t.dataset.tb === 'addc') bl.rows.forEach(r => r.push(''));
        if (t.dataset.tb === 'delr' && bl.rows.length > 1) bl.rows.pop();
        if (t.dataset.tb === 'delc' && nc > 1) bl.rows.forEach(r => r.length = nc - 1);
      }
      if (!t.dataset.bm && !t.dataset.tb) return;
      setBlocks(j, s.no, b, blocks); ubah(); rerender();
    });
  });
}

function muatSampul(j, f) {
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const W = 1131, H = 1600, c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    P.sampul[j] = c.toDataURL('image/jpeg', 0.88); URL.revokeObjectURL(img.src);
    ubah(); render(); toast('Sampul ' + G.JENIS[j].pendek + ' diganti.');
  };
  img.onerror = () => toast('Gambar tidak dapat dibaca.', true);
  img.src = URL.createObjectURL(f);
}
async function ambilTemplate(j) {
  if (UI.tplOverride[j]) return UI.tplOverride[j].buf;
  let r;
  try { r = await fetch(G.JENIS[j].templat); } catch (e) { r = null; }
  if (!r || !r.ok) throw new Error('Template ' + G.JENIS[j].templat + ' tidak dapat dimuat. Jika aplikasi dibuka langsung dari folder (file://), pilih file template lewat tombol "Pakai template lain", atau buka lewat alamat GitHub Pages.');
  return r.arrayBuffer();
}
function dataUrlKeBytes(d) { const b = atob(d.split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function generate(j, nErr) {
  if (nErr && !confirm('Masih ada ' + nErr + ' error pada pemeriksaan. Tetap buat laporan?')) return;
  loading(true, 'Menyusun ' + G.JENIS[j].label + '…');
  try {
    const data = G.dataLaporan(P, j);
    const tpl = await ambilTemplate(j);
    const blob = G.render({ PizZip: window.PizZip, Docxtemplater: window.docxtemplater }, tpl, data, { sampul: P.sampul[j] ? dataUrlKeBytes(P.sampul[j]) : null });
    unduh(blob, 'LAPORAN_MONEV_KINERJA_' + G.JENIS[j].file + '_TW' + P.tw + '_' + P.tahun + '.docx');
    toast(G.JENIS[j].label + ' berhasil dibuat.');
  } catch (e) { toast(e.message, true); console.error(e); } finally { loading(false); }
}

  if (d) {
    try { pakaiProyek(JSON.parse(d)); dirty = true; updTop(); toast('Draf terakhir dipulihkan dari browser. Tekan Simpan untuk memperbarui file di OneDrive.'); return; } catch (e) {}
  }
  render();
})();
